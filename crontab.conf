# 罗海资金费率收割 — crontab 配置（先手工安装）

# ── 每整点扫候选（59:55，略早于结算） ──
# 55 * * * * cd /home/ubuntu/.openclaw/workspace/funding_rebound && /usr/bin/python3 funding_crop.py scan --wait-until-second=55 >> logs/cron_scan.log 2>&1

# ── 每整点开仓（00:01，结算后） ──
# 1 * * * * cd /home/ubuntu/.openclaw/workspace/funding_rebound && /usr/bin/python3 funding_crop.py open --wait-until-second=1 >> logs/cron_open.log 2>&1

# ── 每分钟拉 tracker（内部自循环 55 秒） ──
# * * * * * cd /home/ubuntu/.openclaw/workspace/funding_rebound && /usr/bin/python3 tracker.py >> logs/cron_tracker.log 2>&1

# ── 安装命令 ──
# crontab -e 追加以上三行去掉井号即可
