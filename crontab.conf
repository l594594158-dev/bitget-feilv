# 罗海资金费率收割 — crontab 配置
# 本文件记录【当前真实生效】的 crontab 设置
# 实际安装用: crontab -l / crontab 读入

# ── 费率扫描 + 自动开仓 ──
# 每 15 分钟扫描一次费率;满足条件直接开仓
*/15 * * * * cd /home/ubuntu/.openclaw/workspace/luohai_funding && /usr/bin/python3 funding_crop.py scan --auto-open >> logs/cron_scan.log 2>&1

# ── 仓位跟踪(移动止盈 + 总浮盈全平,内部自循环) ──
# 每分钟跑一次兜底;实际交易所端每3秒刷一次价
* * * * * cd /home/ubuntu/.openclaw/workspace/luohai_funding && /usr/bin/python3 tracker.py >> logs/cron_tracker.log 2>&1

# ── 改动历史 ──
# 2026-09-01: scan 频率 30分钟 → 15分钟 (娜姐指示)
#             备份: /tmp/crontab_backup_before_15min.txt
